  <!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>El Sallayan Çöp Adam</title>

    <!-- CSS dosyasını bağlama -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Çöp adamın tamamını kapsayan ana div -->
<div class="adam">

    <!-- kafa -->
    <div class="kafa"></div>

    <!-- gövde -->
    <div class="govde"></div>

    <!-- sol kol -->
    <div class="kol solKol"></div>

    <!-- sağ kol (javascript ile hareket edecek) -->
    <div class="kol sagKol" id="kol"></div>

    <!-- sol bacak -->
    <div class="bacak solBacak"></div>

    <!-- sağ bacak -->
    <div class="bacak sagBacak"></div>

</div>

<!-- JavaScript dosyasını bağlama -->
<script src="script.js"></script>

</body>
</html>
